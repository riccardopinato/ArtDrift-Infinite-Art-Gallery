name: artdrift
description: An infinite canvas for discovering public-domain paintings.
publish_to: none
version: 0.3.0+3

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  drift_core:
    path: packages/drift_core
  http: ^1.6.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/gallery/catalog.json
    - assets/gallery/thumbs/
