name: ArtDrift Android — analyze, test, ARM64 APK
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Keep only the newest source revision in flight on each development branch.
# Push and pull_request events for the same head branch share this group.
concurrency:
  group: artdrift-android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Configure Flutter Gradle composite plugin repositories
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['FLUTTER_ROOT'])
          path = root / 'packages/flutter_tools/gradle/settings.gradle.kts'
          text = path.read_text(encoding='utf-8')
          if 'pluginManagement {' not in text:
              header = (
                  'pluginManagement {\n'
                  '    repositories {\n'
                  '        google()\n'
                  '        mavenCentral()\n'
                  '        gradlePluginPortal()\n'
                  '    }\n'
                  '}\n\n'
              )
              path.write_text(header + text, encoding='utf-8')
          print('FLUTTER_COMPOSITE_PLUGIN_REPOS_OK')
          PY
      - name: Create Android shell
        run: flutter create --project-name artdrift --org com.riccardopinato --platforms=android .
      - name: Remove Flutter-generated demo test
        run: rm -f test/widget_test.dart
      - name: Patch native platform
        run: python3 scripts/patch_android.py
      - name: Render product launcher icon
        run: |
          python3 -m pip install --disable-pip-version-check "CairoSVG==2.7.1"
          python3 scripts/install_brand_icon.py
      - name: Validate mobile image pack and source eligibility (no network)
        run: python3 scripts/verify_mobile_thumbnail_pack.py
      - name: Dependencies
        run: flutter pub get
      - name: Shared engine dependencies
        run: cd packages/drift_core && flutter pub get
      - name: Shared engine analyze
        run: cd packages/drift_core && flutter analyze --no-fatal-infos
      - name: Shared engine tests
        run: cd packages/drift_core && flutter test
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Tests
        run: flutter test
      - name: Build optimized Android ARM64 APK (internal test signing)
        run: flutter build apk --release --target-platform android-arm64
      - name: Record exact internal APK identity and signer
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          echo "SOURCE_SHA=${{ github.sha }}" > build/apk-integrity.txt
          echo "SIGNING_CLASS=INTERNAL_TEST_ONLY" >> build/apk-integrity.txt
          echo "ANDROID_PACKAGE=com.riccardopinato.artdrift" >> build/apk-integrity.txt
          stat -c 'APK_SIZE_BYTES=%s' "$apk" >> build/apk-integrity.txt
          sha256sum "$apk" >> build/apk-integrity.txt
          tools_dir="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$tools_dir/apksigner" verify --print-certs "$apk" > build/apk-signer-report.txt
      - name: Upload optimized ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: ArtDrift-Android-ARM64-internal-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/apk-integrity.txt
            build/apk-signer-report.txt
          if-no-files-found: error
