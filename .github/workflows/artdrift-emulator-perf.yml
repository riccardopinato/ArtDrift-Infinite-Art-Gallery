name: Art Drift G1 - main baseline emulator QA (no app code changes)
on:
  push:
    branches: ['feat/artdrift-integrated-preview-color-g1-main-baseline-*']
    paths:
      - '.github/workflows/artdrift-emulator-perf.yml'
      - 'scripts/collect_android_emulator_perf.py'
      - 'scripts/run_emulator_pan_probe.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Allow KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare test Android app with stable package ID
        run: |
          flutter create --project-name artdrift --org com.riccardopinato --platforms=android .
          rm -f test/widget_test.dart
          python scripts/patch_android.py
          flutter pub get
      - name: Build test release APK for x86_64 emulator
        run: flutter build apk --release --target-platform android-x64
      - name: Start emulator and exercise fast pan on the real Flutter canvas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run_emulator_pan_probe.sh
      - name: Parse Android emulator data into evidence record
        if: always()
        run: python scripts/collect_android_emulator_perf.py --in build/performance/emulator --out build/performance/emulator/report.json
      - name: Save telemetry and screenshot (emulator, not real device)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArtDrift-Emulator-Pan-Memory-Report
          path: build/performance/emulator/
          if-no-files-found: warn
          retention-days: 30
