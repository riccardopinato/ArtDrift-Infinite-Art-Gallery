name: Art Drift G3 — museum frame + 12 screenshots and transition video (emulator)
on:
  push:
    branches: ['feat/artdrift-g3-ui-capture-*']
    paths:
      - '.github/workflows/artdrift-g3-ui-capture.yml'
      - 'scripts/capture_artdrift_g3_ui.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g3-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare Android emulator package
        run: |
          flutter create --project-name artdrift --org com.riccardopinato --platforms=android .
          rm -f test/widget_test.dart
          python3 scripts/patch_android.py
          flutter pub get
      - name: Build x86_64 test-only APK
        run: flutter build apk --release --target-platform android-x64
      - name: Capture real UI scenarios
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/capture_artdrift_g3_ui.sh
      - name: Upload screenshots and XML for manual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArtDrift-G3-Frame-Flight-QA
          path: build/g3/captures/
          if-no-files-found: warn
          retention-days: 30
