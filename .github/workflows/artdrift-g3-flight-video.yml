name: Art Drift G3 — single-launch origin-flight recording
on:
  push:
    branches: ['feat/artdrift-g3-flight-video-only-*']
    paths:
      - '.github/workflows/artdrift-g3-flight-video.yml'
      - 'scripts/record_artdrift_g3_flight.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Allow KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare QA Android shell
        run: |
          flutter create --project-name artdrift --org com.riccardopinato --platforms=android .
          rm -f test/widget_test.dart
          python3 scripts/patch_android.py
          flutter pub get
      - name: Build emulator-only APK
        run: flutter build apk --release --target-platform android-x64
      - name: Record one real user journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -memory 3072 -noaudio -no-boot-anim -camera-back none
          script: bash scripts/record_artdrift_g3_flight.sh
      - name: Persist QA footage for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArtDrift-G3-Flight-Video
          path: build/g3/flight/
          if-no-files-found: warn
          retention-days: 30
