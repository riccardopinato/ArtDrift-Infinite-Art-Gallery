name: "Art Drift — Nationalmuseum Stockholm independent acquisition"
on:
  push:
    branches:
      - research/artdrift-harvest-nationalmuseum_se-20261126
    paths:
      - .github/workflows/artdrift-harvest-nationalmuseum_se.yml
      - research/museums/20261126/lanes/nationalmuseum_se.json
      - tools/artdrift_parallel_museum_harvest.py
      - tools/test_artdrift_parallel_museum_harvest.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: artdrift-individual-museum-nationalmuseum_se
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Independent source and safety tests
        run: |
          python -m py_compile tools/artdrift_parallel_museum_harvest.py
          python -m unittest discover -s tools -p 'test_artdrift_parallel_museum_harvest.py' -v
      - name: Museum-specific metadata-first harvest
        run: |
          python -u tools/artdrift_parallel_museum_harvest.py --provider nationalmuseum_se --max-records 900 --max-image-checks 120
      - name: Validate no runtime import or unverified rights approval
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/museums/20261126/lanes/results/nationalmuseum_se.json")
          doc=json.loads(p.read_text(encoding="utf-8"))
          assert doc["provider"]=="nationalmuseum_se"
          assert doc["runtime_imported"]==0 and doc["commercially_approved"]==0
          assert doc["catalog_exhaustively_searched"] is False
          assert all(not x.get("commercially_approved",False) and x.get("runtime_visible") is False
                     for x in doc["review_candidates"])
          print("PASS:",doc["provider"],doc["stats"],"candidate_records",doc["candidates_in_report"])
          PY
      - name: Preserve machine-readable report and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArtDrift-Harvest-nationalmuseum_se
          path: |
            research/museums/20261126/lanes/results/nationalmuseum_se.json
            research/museums/20261126/lanes/results/nationalmuseum_se_contact_sheet.jpg
          if-no-files-found: warn
          retention-days: 30
      - name: Commit only this museum's research report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Reconcile a report generated from a prior runner SHA with the
          # latest independent branch tip; no add/add rebase conflicts.
          cp research/museums/20261126/lanes/results/nationalmuseum_se.json /tmp/artdrift-nationalmuseum_se-latest.json
          git fetch origin research/artdrift-harvest-nationalmuseum_se-20261126
          git reset --hard FETCH_HEAD
          cp /tmp/artdrift-nationalmuseum_se-latest.json research/museums/20261126/lanes/results/nationalmuseum_se.json
          git add research/museums/20261126/lanes/results/nationalmuseum_se.json
          if ! git diff --cached --quiet; then
            git commit -m "research(nationalmuseum_se): isolated source inventory and image QA"
            git push origin HEAD:research/artdrift-harvest-nationalmuseum_se-20261126
          fi
