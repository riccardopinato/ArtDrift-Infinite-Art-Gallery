name: ArtDrift — Met full Open Access CSV scenic discovery
on:
  push:
    branches: [research/artdrift-bright-megabatches-20261126]
    paths:
      - tools/artdrift_met_csv_sweep.py
      - .github/workflows/artdrift-met-full-csv.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: artdrift-met-full-csv-20261126
  cancel-in-progress: false
jobs:
  candidate-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only for shared source classifier
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Confirm candidate queue and stream official large CSV
        run: |
          python -m py_compile tools/artdrift_met_csv_sweep.py
          python -u tools/artdrift_met_csv_sweep.py --max-candidates 3000
      - name: Ensure all records HOLD pending image and rights validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('research/mass_bright/20261126/met_full_csv_scenic_queue.json').read_text())
          assert len(j['works']) >= 50
          assert j['image_verified_count'] == 0 and j['runtime_imported'] == 0
          assert len({w['museum_native_id'] for w in j['works']})==len(j['works'])
          assert all(w['is_public_domain_institution'] is True and not w['image_verified']
                     and w['publication_status'].startswith('HOLD') and not w['runtime_visible']
                     for w in j['works'])
          print('MET_FULL_CSV_METADATA_ONLY',len(j['works']))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArtDrift-Met-Full-OA-Scenic-Metadata-HOLD
          path: research/mass_bright/20261126/met_full_csv_scenic_queue.json
          if-no-files-found: warn
      - name: Persist queue in research branch only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mass_bright/20261126/met_full_csv_scenic_queue.json
          git commit -m "research(met): official OA full CSV scene backlog; no images published"
          git pull --rebase origin research/artdrift-bright-megabatches-20261126
          git push origin HEAD:research/artdrift-bright-megabatches-20261126
