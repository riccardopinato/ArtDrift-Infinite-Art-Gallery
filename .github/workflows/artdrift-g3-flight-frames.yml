name: Art Drift G3 — deterministic painting-flight visual frames
on:
  push:
    branches: ['feat/artdrift-g3-flight-frames-*']
    paths:
      - 'test/g3_flight_frames_test.dart'
      - '.github/workflows/artdrift-g3-flight-frames.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Capture flight stills with authentic bundled art and real fonts
        run: |
          SANS="$(find "$FLUTTER_ROOT" -name 'Roboto-Regular.ttf' -print -quit)"
          if [ -z "$SANS" ]; then SANS="$(fc-match -f '%{file}' 'DejaVu Sans')"; fi
          SERIF="$(fc-match -f '%{file}' 'DejaVu Serif')"
          ICONS="$(find "$FLUTTER_ROOT" -name 'MaterialIcons-Regular.otf' -print -quit)"
          test -s "$SANS" && test -s "$SERIF"
          export ARTDRIFT_G3_SANS_FONT="$SANS"
          export ARTDRIFT_G3_SERIF_FONT="$SERIF"
          export ARTDRIFT_G3_ICONS_FONT="$ICONS"
          flutter test --update-goldens test/g3_flight_frames_test.dart
      - name: Archive frames for human visual review (NOT auto-approved)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArtDrift-G3-Flight-Frames
          path: test/goldens/g3_tile_flight_*.png
          if-no-files-found: warn
          retention-days: 30
