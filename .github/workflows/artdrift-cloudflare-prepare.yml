name: Art Drift — D1 unified catalog preparation (no cloud writes)
on:
  push:
    branches: ['feat/artdrift-d1-unified-catalog-*']
    paths:
      - 'cloudflare/art-catalog/**'
      - '.github/workflows/artdrift-cloudflare-prepare.yml'
      - 'assets/museums/**'
      - 'assets/gallery/catalog.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'riccardopinato/ArtDrift-Infinite-Art-Gallery'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate D1 worker routing, SQL injection guards and media rights
        run: |
          cd cloudflare/art-catalog
          npm test
      - name: Validate both D1 importers offline
        run: |
          python3 -m unittest discover -s cloudflare/art-catalog/scripts -p 'test_*.py' -v
      - name: Prepare local 5,084-work museum SQL shards, never remote D1
        run: |
          python3 cloudflare/art-catalog/scripts/make_museum_d1_import.py \
            --root . --out build/d1-museums --expected 5084 --chunk 200
      - name: Check manifest, rights status and P1 fail-closed policy
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('build/d1-museums/manifest.json').read_text())
          assert m['records']==5084
          assert m['d1_remote_import']=='REQUIRES_EXPLICIT_APPROVAL'
          assert m['images_bundled']==0 and m['personal_data'] is False
          assert m['app_canvas_source']=='UNCHANGED_LOCAL'
          assert m['unique_sources']>=8  # existing curated source set; no fictitious institution IDs
          assert sum(i['records'] for i in m['shards'])==5084
          assert not Path('build/moma-d1').exists()
          print('ARTDRIFT_D1_PREPARE_PASS',m['records'],len(m['shards']))
          PY
      - name: Run all 5,084 records through an isolated SQLite FTS5 database
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db=sqlite3.connect(':memory:')
          db.executescript(Path('cloudflare/art-catalog/museum_schema.sql').read_text())
          shards=sorted(Path('build/d1-museums').glob('museum-*.sql'))
          assert len(shards)==26
          for shard in shards:
              db.executescript(shard.read_text(encoding='utf8'))
          rows=db.execute('SELECT COUNT(*) FROM museum_works').fetchone()[0]
          fts=db.execute('SELECT COUNT(*) FROM museum_works_fts').fetchone()[0]
          keys=db.execute('SELECT COUNT(DISTINCT source_key) FROM museum_works').fetchone()[0]
          assert rows==fts==keys==5084,(rows,fts,keys)
          terms=db.execute("SELECT COUNT(*) FROM museum_works_fts WHERE museum_works_fts MATCH 'painting'").fetchone()[0]
          assert terms>0
          for shard in shards:
              db.executescript(shard.read_text(encoding='utf8'))
          assert db.execute('SELECT COUNT(*) FROM museum_works').fetchone()[0]==5084
          print('D1_SQLITE_E2E_FTS_PASS',rows,'matching paintings',terms)
          PY
      - name: Upload D1 museum SQL as internal review artifact, NOT deployment
        uses: actions/upload-artifact@v4
        with:
          name: ArtDrift-D1-Museums-QA
          path: build/d1-museums/
          retention-days: 14
          compression-level: 6
          if-no-files-found: error
