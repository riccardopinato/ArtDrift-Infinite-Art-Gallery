name: ArtDrift - image decode metrics (CI only)
on:
  push:
    branches: ['feat/artdrift-integrated-preview-color-*']
    paths:
      - 'scripts/benchmark_visual_assets.py'
      - '.github/workflows/artdrift-image-benchmark.yml'
      - 'assets/museums/canvas_visual_color_v1.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==12.0.0
      - run: python scripts/benchmark_visual_assets.py --repo . --sample 320
      - uses: actions/upload-artifact@v4
        with:
          name: ArtDrift-Image-Metrics
          path: build/performance/benchmark.json
          if-no-files-found: error
