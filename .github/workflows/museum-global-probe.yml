name: Museum expansion — read-only source schemas
on:
  push:
    branches: [feat/artdrift-open-access-museums-20261121]
    paths: ['scripts/probe_global_museums.py']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -u scripts/probe_global_museums.py
