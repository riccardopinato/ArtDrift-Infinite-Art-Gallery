name: Art Drift — single reviewed Met CC0 painting Android test APK
on:
  push:
    branches:
      - feat/artdrift-first-met-cc0-sisley-20261127
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artdrift-sisley-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  met-cc0-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - run: |
          flutter create --project-name artdrift --org com.riccardopinato --platforms=android .
          rm -f test/widget_test.dart
          python3 scripts/patch_android.py
          flutter pub get
      - name: Verify staged rights documentation and exact source identity
        run: |
          python3 scripts/verify_sisley_cc0_release.py .
      - name: Existing and new default-off tests
        run: |
          flutter analyze --no-fatal-infos
          flutter test --exclude-tags=sisley-flagged
      - name: Explicitly enabled single-artwork smoke test
        run: |
          flutter test --dart-define=ARTDRIFT_ENABLE_CURATED_COMMONS=true test/sisley_commons_approved_test.dart
      - name: Build ARM64 test APK with ONE reviewed image enabled
        run: |
          flutter build apk --release --target-platform android-arm64 --dart-define=ARTDRIFT_ENABLE_CURATED_COMMONS=true
      - uses: actions/upload-artifact@v4
        with:
          name: ArtDrift-Sisley-1-CC0-ARM64-test-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
