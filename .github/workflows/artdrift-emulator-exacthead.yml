name: ArtDrift - Android emulator fast-pan and RAM probe
on:
  push:
    branches: ['ci/artdrift-emulator-current-*']
    paths:
      - '.github/workflows/artdrift-emulator-exacthead.yml'
      - 'scripts/collect_android_emulator_perf.py'
      - 'assets/museums/canvas_visual_color_v1.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ab1f70dcff4a3813b75b5766cbc3f67c41e820f3'
          persist-credentials: false
      - name: Assert pinned integrated app tree
        run: test "$(git rev-parse HEAD)" = 'ab1f70dcff4a3813b75b5766cbc3f67c41e820f3'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Allow KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare test Android app with stable package ID
        run: |
          flutter create --project-name artdrift --org com.riccardopinato --platforms=android .
          rm -f test/widget_test.dart
          python scripts/patch_android.py
          flutter pub get
      - name: Build test release APK for x86_64 emulator
        run: flutter build apk --release --target-platform android-x64
      - name: Start emulator and exercise fast pan on the real Flutter canvas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run_emulator_pan_probe.sh
      - name: Parse Android emulator data into evidence record
        if: always()
        run: python scripts/collect_android_emulator_perf.py --in build/performance/emulator --out build/performance/emulator/report.json
      - name: Mark unusable SurfaceView gfxinfo percentiles as unavailable
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("build/performance/emulator/report.json")
          if p.is_file():
              data=json.loads(p.read_text())
              if not data.get("frames_rendered_reported"):
                  for key in ("janky_frames_reported","frame_p50_ms_reported",
                              "frame_p90_ms_reported","frame_p95_ms_reported"):
                      data[key]=None
                  data["frame_measurement_status"]="UNAVAILABLE_GFXINFO_SURFACEVIEW_NO_SAMPLES"
              else:
                  data["frame_measurement_status"]="GFXINFO_FRAMES_REPORTED_EMULATOR_ONLY"
              data["exact_app_source_sha"]="ab1f70dcff4a3813b75b5766cbc3f67c41e820f3"
              data["physical_device"]=False
              p.write_text(json.dumps(data,indent=2)+"\n")
              print("EMULATOR_FRAME_DATA_QA",data["frame_measurement_status"])
          PY
      - name: Save telemetry and screenshot (emulator, not real device)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArtDrift-Emulator-Pan-Memory-Report
          path: build/performance/emulator/
          if-no-files-found: warn
          retention-days: 30
