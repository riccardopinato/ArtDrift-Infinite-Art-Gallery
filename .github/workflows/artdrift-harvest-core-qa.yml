name: Art Drift — Museum harvest core QA
on:
  push:
    branches:
      - research/artdrift-parallel-harvest-core-20261126
  pull_request:
    paths:
      - tools/artdrift_parallel_museum_harvest.py
      - tools/test_artdrift_parallel_museum_harvest.py
permissions:
  contents: read
jobs:
  safety-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Python syntax and offline tests (no museum API requests)
        run: |
          python -m py_compile tools/artdrift_parallel_museum_harvest.py
          python -m unittest discover -s tools -p 'test_artdrift_parallel_museum_harvest.py' -v
