name: ArtDrift Web Preview — source and build
on:
  push:
    branches: ['feat/artdrift-web-preview*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Validate source-bound image color scores
        run: python3 scripts/validate_visual_palette.py
      - name: Prepare Flutter Web, analyze and test
        run: |
          flutter create --project-name artdrift --org com.riccardopinato --platforms=web .
          rm -f test/widget_test.dart
          flutter pub get
          (cd packages/drift_core && flutter pub get && flutter analyze --no-fatal-infos && flutter test)
          flutter analyze --no-fatal-infos
          flutter test
          # Compile and execute the browser-only HTML image preloader.
          flutter test --platform chrome test/art_remote_image_test.dart test/art_thumbnail_prefetch_test.dart test/art_offline_thumbnail_index_test.dart
      - name: Assert real offline-image coverage for thumbnail PR
        if: startsWith(github.head_ref, 'feat/artdrift-web-offline-thumbs-')
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("web/museum_thumbs/manifest.json").read_text())
          keys=manifest["keys"]
          assert len(keys)>=50, f"Insufficient validated offline thumbnails: {len(keys)}"
          assert len(keys)==len(set(keys))
          for key in keys:
              source,ident=key.split(":")
              file=Path(f"web/museum_thumbs/{source}_{int(ident)}.webp")
              assert file.is_file() and 250<=file.stat().st_size<=24000
          print("REAL_PACKED_WEB_IMAGES",len(keys))
          PY
      - name: Build web preview
        run: flutter build web --release --base-href /
      - name: Upload immutable web build
        uses: actions/upload-artifact@v4
        with:
          name: ArtDrift-Web-preview-${{ github.sha }}
          path: build/web/
          if-no-files-found: error
