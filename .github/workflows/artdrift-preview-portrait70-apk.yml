name: Art Drift — portrait70 safe parallel-install APK
on:
  push:
    branches: ['ci/artdrift-portrait70-safe-apk-*']
permissions:
  contents: read
jobs:
  safe-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'dc1b52e19b3686a1160b25c7165f5fa483939f7a'
          persist-credentials: false
      - name: Verify exact immutable app source
        run: test "$(git rev-parse HEAD)" = 'dc1b52e19b3686a1160b25c7165f5fa483939f7a'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Configure composite Flutter plugin repositories
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['FLUTTER_ROOT'])/'packages/flutter_tools/gradle/settings.gradle.kts'
          text=p.read_text()
          if 'pluginManagement {' not in text:
              p.write_text('pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\n\n'+text)
          PY
      - name: Generate Android shell and icon from verified source
        run: |
          flutter create --project-name artdrift --org com.riccardopinato --platforms=android .
          rm -f test/widget_test.dart
          python3 scripts/patch_android.py
          python3 -m pip install --disable-pip-version-check CairoSVG==2.7.1
          python3 scripts/install_brand_icon.py
      - name: Isolate test app under separate application ID without touching real app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/build.gradle.kts")
          s=p.read_text()
          old='applicationId = "com.riccardopinato.artdrift"'
          assert s.count(old)==1
          p.write_text(s.replace(old,'applicationId = "com.riccardopinato.artdrift.preview"'))
          manifest=Path("android/app/src/main/AndroidManifest.xml")
          xml=manifest.read_text()
          out,n=re.subn(r'android:label="[^"]+"','android:label="Art Drift Preview"',xml,count=1)
          assert n==1
          manifest.write_text(out)
          print('SEPARATE_PACKAGE_ID_OK com.riccardopinato.artdrift.preview')
          PY
      - name: Validate source and tests
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build safe ARM64 preview APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify APK package and record its test-only signing certificate
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$SDK_TOOLS/apksigner" verify --print-certs "$APK" > build/preview-signature.txt
          "$SDK_TOOLS/aapt" dump badging "$APK" | grep '^package:' > build/preview-package.txt
          grep -q "name='com.riccardopinato.artdrift.preview'" build/preview-package.txt
          sha256sum "$APK" > build/preview-sha256.txt
          echo 'ARTDRIFT_TEST_APP_SIDE_BY_SIDE_PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: ArtDrift-2400-portrait70-safe-ARM64
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/preview-signature.txt
            build/preview-package.txt
            build/preview-sha256.txt
          if-no-files-found: error
          retention-days: 30
