name: Art Drift - visual-first pixel analysis and 1200 image mosaic
on:
  push:
    branches:
      - 'feat/artdrift-visual-color-canvas-*'
    paths:
      - 'scripts/build_visual_first_collection.py'
      - '.github/workflows/artdrift-visual-color.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'feat/artdrift-visual-color-canvas-wave1-20261123'
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Image analysis dependency
        run: python -m pip install --disable-pip-version-check Pillow==12.0.0
      - name: Pixel-based visual palette analysis of existing WebP images
        run: |
          python scripts/build_visual_first_collection.py --repo . --out build/visual-color --count 1200
      - name: Audit image identity and manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("assets/museums/canvas_visual_color_v1.json").read_text())
          assert m["selected_count"]==1200
          assert len(set(m["selection"]))==1200
          assert m["image_downloads"]==0
          assert not m["commercial_rights_certified"]
          print("VISUAL_FIRST_1200_SELECTION_PASS")
          PY
      - name: Save source-aware per-work audit and 120-image preview mosaic
        uses: actions/upload-artifact@v4
        with:
          name: ArtDrift-Visual-Curation-1200
          path: build/visual-color/
          retention-days: 30
          if-no-files-found: error
      - name: Commit generated selection manifest into only this draft branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/museums/canvas_visual_color_v1.json
          if ! git diff --cached --quiet; then
            git commit -m "data(artdrift): 1200 artwork pixel-curated color-first selection"
            git push origin HEAD:feat/artdrift-visual-color-canvas-wave1-20261123
          fi
