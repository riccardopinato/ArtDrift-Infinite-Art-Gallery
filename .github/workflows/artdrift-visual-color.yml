name: Art Drift - visual-first pixel analysis and 2400 image mosaic
on:
  push:
    branches:
      - 'feat/artdrift-integrated-preview-color-*'
    paths:
      - 'scripts/build_visual_first_collection.py'
      - '.github/workflows/artdrift-visual-color.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'feat/artdrift-integrated-preview-color-20261123'
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Image analysis dependency
        run: python -m pip install --disable-pip-version-check Pillow==12.0.0 opencv-python-headless==4.12.0.88
      - name: Pixel-based visual palette analysis of existing WebP images
        run: |
          python scripts/build_visual_first_collection.py --repo . --out build/visual-color --count 2400
      - name: Audit image identity and manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("assets/museums/canvas_visual_color_v1.json").read_text())
          assert m["selected_count"]==2400
          assert len(set(m["selection"]))==2400
          assert m["image_downloads"]==0
          assert not m["commercial_rights_certified"]
          p=m["portrait_policy"]
          assert p["portrait_before"]>=100
          assert p["portrait_after"]*10<=p["portrait_before"]*3
          assert p["portraits_replaced"]==p["portrait_before"]-p["portrait_after"]
          assert p["new_image_files_added"]==0
          assert p["portraits_in_first_120"]<=9
          assert p["portrait_distribution"]=="Evenly spaced through 2400 works"
          print("PORTRAITS_REDUCED_AT_LEAST_70_PERCENT",p)
          print("VISUAL_FIRST_2400_SELECTION_PASS")
          PY
      - name: Save source-aware per-work audit and 120-image preview mosaic
        uses: actions/upload-artifact@v4
        with:
          name: ArtDrift-Visual-Curation-2400
          path: build/visual-color/
          retention-days: 30
          if-no-files-found: error
      - name: Commit generated selection manifest into only this draft branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/museums/canvas_visual_color_v1.json
          if ! git diff --cached --quiet; then
            git commit -m "data(artdrift): 2400 artwork pixel-curated color-first selection"
            git push origin HEAD:feat/artdrift-integrated-preview-color-20261123
          fi
