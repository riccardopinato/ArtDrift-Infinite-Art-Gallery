name: Museum source response inspection (development only)
on:
  push:
    branches: [feat/artdrift-open-access-museums-20261121]
    paths: [scripts/probe_museum_sources.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Inspect official data content types and schemas
        run: python -u scripts/probe_museum_sources.py
