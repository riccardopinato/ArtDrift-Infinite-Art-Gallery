name: ArtDrift — import modern Open Access artworks (1950+)
on:
  push:
    branches: ['feat/artdrift-modern-1950-openaccess-20261123']
    paths:
      - 'scripts/import_modern_1950_openaccess.py'
      - 'scripts/test_modern_1950_openaccess.py'
      - 'scripts/probe_modern_1950_api.py'
      - 'scripts/probe_smithsonian_modern.py'
      - 'scripts/probe_commons_modern.py'
      - 'scripts/import_modern_commons.py'
      - 'scripts/test_modern_commons.py'
      - '.github/workflows/modern-openaccess.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: artdrift-modern-1950-data
  cancel-in-progress: false
jobs:
  import:
    # Metadata is allowed only on this explicit feature branch. This workflow
    # NEVER modifies the main branch or user-owned favorites.
    if: github.repository == 'riccardopinato/ArtDrift-Infinite-Art-Gallery' && github.ref == 'refs/heads/feat/artdrift-modern-1950-openaccess-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Offline parsing, rights and idempotency tests
        run: |
          python3 -m unittest discover -s scripts -p test_modern_1950_openaccess.py -v
          python3 -m unittest discover -s scripts -p test_modern_commons.py -v
      - name: Import independently authored and commercially licensed modern paintings
        run: python3 scripts/import_modern_commons.py
      - name: Audit source provenance, record count and size
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('assets/museums/catalog_modern_1950.json').read_text())
          report=json.loads(Path('assets/museums/modern_1950_report.json').read_text())
          assert rows and len(rows)==report['admitted_records']
          allowed={'CC0','CC BY 3.0','CC BY 4.0','CC BY-SA 3.0','CC BY-SA 4.0'}
          assert all(x['rights_license'] in allowed for x in rows)
          assert all(x['is_public_domain']==(x['rights_license']=='CC0') for x in rows)
          assert all(1950<=x['creation_year_verified']<=2026 for x in rows)
          assert all(x['museum_source']=='commons' for x in rows)
          assert all(x['remote_preview_url'].startswith('https://upload.wikimedia.org/') for x in rows)
          assert all(x['rights_evidence_url'].startswith('https://commons.wikimedia.org/') for x in rows)
          assert len({(x['museum_source'],x['museum_native_id']) for x in rows})==len(rows)
          assert report['production_release']=='NOT_AUTHORIZED'
          print('MODERN_CATALOG_DATA_GATE_PASS', len(rows))
          PY
      - name: Commit validated catalog to isolated feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/museums/catalog_modern_1950.json assets/museums/modern_1950_report.json
          if git diff --cached --quiet; then
            echo "MODERN_CATALOG_UNCHANGED"
          else
            git commit -m "data(artdrift): add verified modern 1950+ CC0 museum catalog"
            git push origin HEAD:feat/artdrift-modern-1950-openaccess-20261123
          fi
