name: Art Drift — measure actual WebP preview dimensions
on:
  push:
    branches: ['feat/artdrift-joyful-random-start-*']
    paths:
      - 'scripts/generate_real_webp_dimensions.py'
      - '.github/workflows/artdrift-real-webp-dimensions.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dimensions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan WebP RIFF headers and generate source-bound aspect manifest
        run: python3 scripts/generate_real_webp_dimensions.py
      - uses: actions/upload-artifact@v4
        with:
          name: artdrift-real-webp-dimensions
          path: assets/museums/canvas_real_webp_dimensions_v1.json
          if-no-files-found: error

      - name: Publish verified dimensions manifest only to feature branch
        if: github.ref == 'refs/heads/feat/artdrift-joyful-random-start-20261125'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/museums/canvas_real_webp_dimensions_v1.json
          if git diff --cached --quiet; then
            echo REAL_WEBP_MANIFEST_UNCHANGED
          else
            git commit -m 'data(artdrift): record exact bundled WebP widths and heights'
            git push origin HEAD:feat/artdrift-joyful-random-start-20261125
          fi
