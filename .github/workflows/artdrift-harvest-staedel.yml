name: "Art Drift — staedel independent acquisition and lossless inventory"
on:
  push:
    branches:
      - research/artdrift-harvest-staedel-20261126
    paths:
      - .github/workflows/artdrift-harvest-staedel.yml
      - tools/artdrift_parallel_museum_harvest.py
      - tools/artdrift_parallel_museum_reconcile.py
      - tools/test_artdrift_parallel_museum_reconcile.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: artdrift-individual-museum-staedel
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Offline safety and idempotent-merge tests
        run: |
          python -m py_compile tools/artdrift_parallel_museum_harvest.py tools/artdrift_parallel_museum_reconcile.py
          python -m unittest discover -s tools -p 'test_artdrift_parallel_museum_harvest.py' -v
          python -m unittest discover -s tools -p 'test_artdrift_parallel_museum_reconcile.py' -v
      - name: Preserve prior run before harvesting
        run: |
          mkdir -p .artdrift_eu/previous
          if test -f research/museums/20261126/lanes/results/staedel.json; then cp research/museums/20261126/lanes/results/staedel.json .artdrift_eu/previous/staedel.json; fi
      - name: Fresh museum search only on explicit source-run event
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[harvest:staedel]')
        run: python -u tools/artdrift_parallel_museum_harvest.py --provider staedel --max-records 400 --max-image-checks 60
      - name: Preserve union and create human-only visual shortlist (no API calls)
        run: |
          python -u tools/artdrift_parallel_museum_reconcile.py --provider staedel --prior .artdrift_eu/previous/staedel.json --snapshot research/museums/20261126/lanes/snapshots/staedel_first_discovery.json --max-review 120
      - name: Enforce nonpublishing evidence gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('research/museums/20261126/lanes/results/staedel.json').read_text(encoding='utf-8'))
          b=json.loads(Path('research/museums/20261126/lanes/reviews/staedel_visual_shortlist.json').read_text(encoding='utf-8'))
          assert a['provider']=='staedel' and b['provider']=='staedel'
          assert a['runtime_imported']==0 and a['commercially_approved']==0
          assert a['catalog_exhaustively_searched'] is False
          assert all(x.get('runtime_visible') is False and x.get('commercially_approved') is False for x in a['review_candidates'])
          assert b['runtime_imported']==0 and b['ready_to_import']==0
          print('PASS',a['provider'],'cumulative',a['cumulative_distinct_candidate_records'],'review',len(b['items_for_review']))
          PY
      - name: Preserve this museum's evidence and visual shortlist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArtDrift-Cumulative-staedel
          path: |
            research/museums/20261126/lanes/results/staedel.json
            research/museums/20261126/lanes/reviews/staedel_visual_shortlist.json
            research/museums/20261126/lanes/results/staedel_contact_sheet.jpg
          if-no-files-found: warn
          retention-days: 30
      - name: Commit only this museum's two research JSON files
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp research/museums/20261126/lanes/results/staedel.json /tmp/staedel-inventory.json
          cp research/museums/20261126/lanes/reviews/staedel_visual_shortlist.json /tmp/staedel-visual.json
          git fetch origin research/artdrift-harvest-staedel-20261126
          git reset --hard FETCH_HEAD
          mkdir -p research/museums/20261126/lanes/results research/museums/20261126/lanes/reviews
          cp /tmp/staedel-inventory.json research/museums/20261126/lanes/results/staedel.json
          cp /tmp/staedel-visual.json research/museums/20261126/lanes/reviews/staedel_visual_shortlist.json
          git add research/museums/20261126/lanes/results/staedel.json research/museums/20261126/lanes/reviews/staedel_visual_shortlist.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(staedel): reconcile retained museum IDs and visual HOLD queue'
            git push origin HEAD:research/artdrift-harvest-staedel-20261126
          fi
