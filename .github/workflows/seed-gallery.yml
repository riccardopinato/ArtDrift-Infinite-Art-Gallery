name: Generate tiny real-art bootstrap (manual/source only)
on:
  push:
    branches: [feat/lightweight-real-artwork-bootstrap]
    paths:
      - 'scripts/build_seed_gallery.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seed-open-access:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Build rights-filtered metadata + tiny WebP previews
        run: python scripts/build_seed_gallery.py
      - name: Audit byte budget and no hi-res assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("assets/gallery/catalog.json")
          works = json.loads(p.read_text(encoding="utf-8"))
          images = list(Path("assets/gallery/thumbs").glob("*.webp"))
          total = sum(x.stat().st_size for x in images)
          assert len(images) == len(works) >= 28, (len(images), len(works))
          assert total < 2_000_000, total
          assert all(x["is_public_domain"] and x["artwork_type_title"].lower() == "painting" for x in works)
          print("ASSETS_VERIFIED works =", len(works), "preview_bytes =", total)
          PY
      - name: Commit frozen source assets to DEVELOPMENT BRANCH only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gallery
          if ! git diff --cached --quiet; then
            git commit -m "assets: pin verified Open Access paintings as tiny WebP bootstrap"
            git fetch origin feat/lightweight-real-artwork-bootstrap
            git rebase origin/feat/lightweight-real-artwork-bootstrap
            git push origin "HEAD:feat/lightweight-real-artwork-bootstrap"
          fi
