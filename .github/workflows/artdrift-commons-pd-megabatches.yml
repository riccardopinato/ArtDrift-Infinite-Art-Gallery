name: ArtDrift — Commons 8 public-domain painter-scene batches
on:
  push:
    branches: [research/artdrift-bright-megabatches-20261126]
    paths:
      - tools/artdrift_commons_pd_bright.py
      - tools/test_artdrift_commons_pd_bright.py
      - tools/artdrift_commons_pd_aggregate.py
      - .github/workflows/artdrift-commons-pd-megabatches.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: artdrift-commons-pd-mega-20261126
  cancel-in-progress: false
jobs:
  curator:
    name: commons-pd-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 27
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - run: |
          python -m py_compile tools/artdrift_commons_pd_bright.py
          python -m unittest discover -s tools -p test_artdrift_commons_pd_bright.py -v
      - name: Official Commons file metadata and independently decoded images
        run: python -u tools/artdrift_commons_pd_bright.py --shard "${{ matrix.shard }}" --max-images 260 --workers 4
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Commons-PD-Bright-${{ matrix.shard }}
          path: .artdrift_research/commons_mass/batch_*/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
  combine:
    name: Commons licensed art shortlist — no runtime merge
    needs: [curator]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - uses: actions/download-artifact@v4
        with:
          pattern: Commons-PD-Bright-*
          path: .artdrift_research/commons_incoming
          merge-multiple: false
      - run: python -u tools/artdrift_commons_pd_aggregate.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArtDrift-Commons-PD-Bright-Combined
          path: research/mass_bright/20261126/commons_*
          if-no-files-found: warn
          retention-days: 30
      - name: Persist ONLY source evidence in research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mass_bright/20261126/commons_pd_bright_verified.json
          if ! git diff --cached --quiet; then
            git commit -m "research(artdrift): 8 Commons PD raster-checked painter batches"
            git pull --rebase origin research/artdrift-bright-megabatches-20261126
            git push origin HEAD:research/artdrift-bright-megabatches-20261126
          fi
