name: Art Drift — NGA 29 candidates live IIIF pixel and CDN QA
on:
  push:
    branches:
      - qa/artdrift-nga-official-openaccess-bulk-20261127
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: artdrift-nga-live-29-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-live-images:
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - uses: actions/download-artifact@v4
        with:
          name: ArtDrift-NGA-Official-7-Artists-OpenAccess-Discovery
          run-id: '45970465626'
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: official-source
      - name: Fetch and decode each exact image via NGA IIIF
        run: |
          python -u scripts/artdrift_nga_live_media_qa.py \
            --source official-source/nga_7artists_new_openaccess_candidates.json \
            --shard ${{ matrix.shard }} --out shard-results
      - uses: actions/upload-artifact@v4
        with:
          name: ArtDrift-NGA-Live-IIIF-Shard-${{ matrix.shard }}
          path: shard-results/nga_shard_*.json
          if-no-files-found: error
          retention-days: 30
  combine:
    needs: verify-live-images
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ArtDrift-NGA-Live-IIIF-Shard-*
          merge-multiple: true
          path: all-shards
      - name: Exactly 29 original candidates with independent decoding results
        run: |
          python scripts/artdrift_nga_live_media_qa.py \
            --aggregate --shard-dir all-shards --out aggregated
      - uses: actions/upload-artifact@v4
        with:
          name: ArtDrift-NGA-29-Live-IIIF-Final-Validation
          path: aggregated/*
          if-no-files-found: error
          retention-days: 30
